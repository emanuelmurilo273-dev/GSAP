# Uso:  cp .env.example .env  (preencha)  →  docker compose up --build
# O Supabase fica na nuvem (supabase.com): rode supabase/migrations/001_init.sql lá antes de subir.
services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis-data:/data]
    restart: unless-stopped

  web:
    build:
      context: .
      target: web
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-NEONDESK}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    env_file: .env
    ports: ["3000:3000"]
    restart: unless-stopped

  worker:
    build:
      context: .
      target: worker
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379   # sobrescreve o valor do .env dentro do Docker
    depends_on: [redis]
    restart: unless-stopped

volumes:
  redis-data:
