# Uso:  cp .env.example .env  (preencha)  →  docker compose up --build
# O Supabase fica na nuvem (supabase.com): rode supabase/migrations/001_init.sql lá antes de subir.
services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis-data:/data]
    restart: unless-stopped

  web:
    build:
      context: .
      target: web
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-HEXADESK}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    env_file: .env
    extra_hosts: ["host.docker.internal:host-gateway"]   # acessa o Supabase local rodando no seu PC
    ports: ["${WEB_PORT:-3000}:3000"]
    restart: unless-stopped

  # Simulador interno do day trade B3: mercado ARTIFICIAL, dinheiro fictício, sem login. Liga sozinho com o resto.
  simulador:
    build:
      context: .
      dockerfile: Dockerfile.sim
    env_file: .env
    extra_hosts: ["host.docker.internal:host-gateway"]
    restart: unless-stopped

  worker:
    profiles: ["cripto"]   # legado (robô de cripto): só sobe com `docker compose --profile cripto up`
    build:
      context: .
      target: worker
    env_file: .env
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      REDIS_URL: redis://redis:6379   # sobrescreve o valor do .env dentro do Docker
    depends_on: [redis]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 3

volumes:
  redis-data:
