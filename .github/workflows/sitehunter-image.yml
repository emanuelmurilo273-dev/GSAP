# Publica a imagem pronta do SiteHunter AI no GitHub Container Registry,
# para o instalador baixar o app já montado (sem compilar no computador do usuário).
name: SiteHunter AI - imagem Docker
on:
  push:
    branches: [claude/funny-hopper-0mr6uu, main]
    paths: ["sitehunter-ai/**", ".github/workflows/sitehunter-image.yml"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: sitehunter-ai
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/emanuelmurilo273-dev/sitehunter-ai:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
